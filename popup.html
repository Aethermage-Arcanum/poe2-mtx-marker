<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PoE2 MTX Marker</title>
  <style>
    body { margin: 0; padding: 10px 12px; min-width: 260px; font: 13px/1.4 sans-serif; color: #222; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; }
    th { text-align: left; font-weight: normal; color: #555; padding: 2px 8px 2px 0; }
    td { text-align: right; font-weight: bold; padding: 2px 0; }
    .box { margin-top: 8px; padding: 6px 8px; border-radius: 4px; }
    .stale { background: #fff3cd; color: #6b4e00; font-weight: bold; }
    .error { background: #f8d7da; color: #721c24; }
    .hint { background: #eef; color: #224; }
  </style>
</head>
<body>
  <h1>PoE2 MTX Marker</h1>
  <div id="permission" class="box error" data-i18n="popupPermissionMissing" hidden></div>
  <table>
    <tr><th data-i18n="popupMatched"></th><td id="matched">-</td></tr>
    <tr><th data-i18n="popupTotalCards"></th><td id="total">-</td></tr>
    <tr><th data-i18n="popupFetchedAt"></th><td id="fetched-at">-</td></tr>
    <tr><th data-i18n="popupSource"></th><td id="source">-</td></tr>
  </table>
  <div id="no-shop-tab" class="box hint" data-i18n="popupNoShopTab" hidden></div>
  <div id="stale" class="box stale" hidden></div>
  <div id="error" class="box error" hidden></div>
  <script src="lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
