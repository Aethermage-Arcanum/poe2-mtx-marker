<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>PoE2 MTX Marker - Einstellungen</title>
  <style>
    body { margin: 0; padding: 16px; font: 13px/1.4 sans-serif; color: #222; background: #fff; }
    label { display: block; margin-bottom: 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .stage { margin-top: 16px; padding: 30px 40px; background: #1b1b1b; border-radius: 6px; }
    .preview-card { position: relative; width: 160px; height: 120px; background: #2c2622; color: #d8c8a0;
      box-sizing: border-box; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; }
    .preview-label { position: absolute; left: 10px; bottom: 4px; padding: 1px 6px; border-radius: 3px;
      font: bold 11px/16px sans-serif; white-space: nowrap; }
  </style>
</head>
<body>
  <label>Farbe des Rahmens
    <span class="row"><input type="color" id="color"></span>
  </label>
  <label>Intensität des Leuchtens
    <span class="row"><input type="range" id="intensity" step="1"><output id="intensity-value"></output></span>
  </label>
  <div>Vorschau</div>
  <div class="stage">
    <div class="preview-card" id="preview">Shop-Karte<span class="preview-label" id="preview-label"></span></div>
  </div>
  <script src="lib/core.js"></script>
  <script src="options.js"></script>
</body>
</html>
